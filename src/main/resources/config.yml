# =============================================================
# VoidTeams 2.1 - Configuración
# Plugin dedicado únicamente a equipos para UHC / competitive.
# =============================================================

# Si está en true, los equipos se borran al apagar/reiniciar.
# Si está en false, el scoreboard de Minecraft conserva los equipos.
clear-teams-on-stop: true

# TeamSize máximo por defecto.
max-team-size: 2

# Choosen = invitaciones / Random = reparto / Vote = configurable por votación.
team-type: "Choosen"

# Daño entre compañeros.
friendly-fire: false

# Bloqueos persistentes del sistema base.
teams-locked: false
team-chat-locked: false

# Invitaciones.
invite-expire-seconds: 60

# Votaciones.
vote-duration-seconds: 30

# Broadcast global cuando alguien acepta una invitación.
broadcast-team-joins: true

# El Team Chat se registra en consola para moderación.
team-chat-log-console: true

# Permitir que jugadores normales cambien aleatoriamente el estilo de su team.
players-can-randomize-color: true
players-can-randomize-icon: true


# =============================================================
# TEAM SCENARIOS
